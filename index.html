<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dibujar trazos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- Para añadirla a la pantalla de inicio del iPad como app a pantalla completa -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trazos">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" href="icono-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root { --barra: #fff; --tinta: #111; --acento: #0a7cff; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9d9d9;
    position: fixed; width: 100%;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }

  /* Barra de botones grandes y táctiles */
  #barra { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; gap: 8px;
    flex-wrap: wrap; align-items: center; padding: 8px max(10px, env(safe-area-inset-right)) 8px max(10px, env(safe-area-inset-left));
    padding-top: max(8px, env(safe-area-inset-top));
    background: var(--barra); border-bottom: 1px solid #bbb;
    transition: opacity .2s; }
  #barra.dibujando { opacity: .15; pointer-events: none; }   /* no estorba mientras dibujas */
  #barra button, #barra label.boton { flex: none; min-width: 48px; height: 48px; padding: 0 14px;
    font-size: 17px; border: 1px solid #999; border-radius: 10px; background: #f4f4f4; color: var(--tinta);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  #barra button:active, #barra label.boton:active { background: #ddd; }
  #barra button:disabled { opacity: .35; }
  #barra button.activo { background: var(--acento); border-color: var(--acento); color: #fff; }
  #barra .sep { flex: none; width: 1px; height: 32px; background: #ccc; }
  #barra .grosor { flex: none; display: flex; align-items: center; gap: 8px; font-size: 14px; }
  #barra input[type=range] { width: 130px; height: 48px; }
  #barra .colores { flex: none; display: flex; align-items: center; gap: 6px; }
  #barra .color { flex: none; width: 36px; height: 36px; min-width: 36px; padding: 0; border-radius: 50%; border: 2px solid #999; }
  #barra .color.activo { border: 3px solid var(--acento); box-shadow: 0 0 0 2px #fff inset; }
  #barra input[type=color] { flex: none; width: 48px; height: 48px; padding: 2px; border: 1px solid #999; border-radius: 10px; background: #f4f4f4; }
  #estado { flex: none; font-size: 13px; color: #666; min-width: 70px; }
  #aviso { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 6;
    background: rgba(0,0,0,.8); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 15px;
    opacity: 0; transition: opacity .25s; pointer-events: none; }
  #aviso.visible { opacity: 1; }
</style>
</head>
<body>

<div id="barra">
  <button id="bDeshacer" title="Deshacer">↶ Deshacer</button>
  <button id="bRehacer" title="Rehacer">↷</button>
  <button id="bBorrar" title="Borrar todo (se puede deshacer)">Borrar todo</button>
  <span class="sep"></span>
  <span class="grosor">Grosor <input id="rGrosor" type="range" min="4" max="80" value="14"></span>
  <span class="sep"></span>
  <span class="colores" id="colores">
    <button class="color" data-c="#000000" style="background:#000" title="Negro"></button>
    <button class="color" data-c="#e53935" style="background:#e53935" title="Rojo"></button>
    <button class="color" data-c="#1e66f5" style="background:#1e66f5" title="Azul"></button>
    <button class="color" data-c="#2e9e4f" style="background:#2e9e4f" title="Verde"></button>
    <button class="color" data-c="#f5b400" style="background:#f5b400" title="Amarillo"></button>
    <button class="color" data-c="#ffffff" style="background:#fff" title="Blanco"></button>
    <input id="cColor" type="color" value="#000000" title="Elegir otro color">
  </span>
  <span class="sep"></span>
  <label class="boton" title="Poner una imagen de fondo para pintar encima">Imagen<input id="fImagen" type="file" accept="image/*" hidden></label>
  <button id="bFondo" title="Mostrar / ocultar la imagen de fondo" disabled>Fondo</button>
  <span class="sep"></span>
  <button id="bZoomMenos" title="Alejar">－</button>
  <button id="bZoomMas" title="Acercar">＋</button>
  <button id="bEncajar" title="Encuadrar todo lo dibujado">Ver todo</button>
  <button id="bMover" title="Mover la hoja con un dedo (no dibuja mientras está activo)">✋ Mover</button>
  <span class="sep"></span>
  <button id="bSVG" title="Descargar SVG">SVG</button>
  <button id="bJSON" title="Descargar JSON">JSON</button>
  <button id="bCompartir" title="Compartir (AirDrop, Mensajes…)">Compartir</button>
  <label class="boton" title="Cargar un JSON guardado">Abrir<input id="fArchivo" type="file" accept=".json,application/json" hidden></label>
  <button id="bPantalla" title="Pantalla completa" hidden>⛶</button>
  <span id="estado"></span>
</div>
<div id="aviso"></div>

<script src="p5.min.js"></script>   <!-- copia local: funciona sin Internet -->
<script>
/* ==========================================================================
   Dibujar trazos — mini aplicación de dibujo para iPad (Apple Pencil), móvil y ratón.

   FORMATO DE SALIDA
   LIENZO INFINITO: se puede dibujar en cualquier sitio y alejar el zoom hasta el 2 %.
   Las coordenadas son "unidades de hoja" (la vista inicial equivale a una hoja de 3508 × 2481).
   - SVG: cada trazo es un <path> sin relleno; el viewBox se ajusta a lo dibujado.
     Es justo lo que cargan tus bocetos (comun/svg-puntos.js muestrea cada path), así que
     el archivo se abre directamente en trazo-midi, trazo-cuerpo, etc. con "Cargar otro SVG".
   - JSON: para seguir dibujando después. Coordenadas en unidades de hoja (formato v2;
     los archivos v1, con coordenadas 0..1, se siguen leyendo):
       { formato:"trazos-v2", hoja:{ancho,alto},
         trazos:[ { grosor, puntos:[[x, y, ms, presión], ...] } ] }
   ========================================================================== */

/* ───────── Ajustes ───────── */
const HOJA_W = 3508, HOJA_H = 2481;     // la vista inicial equivale a esta hoja (unidades del SVG)
const SUAVIZADO = 0.5;                  // 0 = sin suavizar, 0.9 = muy suavizado (con retraso)
const DIST_MIN = 1.5;                   // px: no guardar puntos más juntos que esto
const CLAVE = 'dibujar-trazos-v1';      // localStorage

/* ───────── Estado ───────── */
let trazos = [];          // trazos terminados: { grosor, puntos:[[x,y,ms,p],...] } (x,y en 0..1)
let deshacer = [], rehacer = [];        // historial: copias de la lista de trazos
let actual = null;        // trazo que se está dibujando
let idPuntero = null;     // puntero que dibuja (se ignoran los demás: sin dos dedos ni palma)
let hayLapiz = false;     // si se ha visto un Apple Pencil, el dedo deja de dibujar (palma)
let grosor = 14;          // en unidades de la hoja
let color = '#000000';    // color de los trazos nuevos
let fondo = null;         // imagen de fondo: { img, url } (se pinta debajo de los trazos, no se exporta)
let fondoVisible = true;
const CLAVE_FONDO = 'dibujar-trazos-v1-fondo';
let esc = 1, ox = 0, oy = 0;            // hoja en pantalla: escala y esquina superior izquierda
// Vista (zoom y desplazamiento): z = aumento (1 = hoja entera); (cx, cy) = punto del lienzo (unidades de hoja) que queda en el centro
const vista = { z: 1, cx: HOJA_W / 2, cy: HOJA_H / 2 };
const ZOOM_MAX = 24, ZOOM_MIN = 0.02;
const LIMITE = 1e6;       // distancia máxima desde el origen (para no perderse en el infinito)
let escBase = 1;          // escala con la hoja entera a la vista
let capaVista = null;     // vista con la que se pintó `capa` (para estirarla mientras haces zoom)
let modoMover = false;    // botón ✋: un dedo (o el ratón) mueve la hoja en vez de dibujar
const punteros = new Map();   // dedos/ratón apoyados: id → {x, y} (el Pencil no cuenta, salvo en modo mover)
let gesto = null;         // gesto de zoom/desplazamiento en curso: { cx, cy, d } (centro y distancia anteriores)
let capa;                 // trazos terminados ya pintados (para no repintarlos en cada movimiento)
let t0 = 0, ultimo = null;

const $ = (id) => document.getElementById(id);

/* ───────── p5 ───────── */
function setup() {
  pixelDensity(Math.min(window.devicePixelRatio || 1, 2));
  const c = createCanvas(windowWidth, windowHeight);
  noLoop();                                         // solo se repinta cuando hace falta
  const el = c.elt;
  el.addEventListener('pointerdown', alBajar);
  el.addEventListener('pointermove', alMover);
  el.addEventListener('pointerup', alSubir);
  el.addEventListener('pointercancel', alSubir);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
  el.addEventListener('wheel', alRueda, { passive: false });
  // iOS: sin zoom por pellizco ni scroll
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((n) => document.addEventListener(n, (e) => e.preventDefault()));
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  cargarLocal();
  actualizarColores();
  try { const f = localStorage.getItem(CLAVE_FONDO); if (f) ponerFondo(f).catch(() => {}); } catch (x) { /* nada */ }
  colocarHoja();
  reconstruir();
  actualizarBotones();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  colocarHoja();
  reconstruir();
}

/** Calcula dónde cae la hoja en pantalla (debajo de la barra, centrada y ajustada). */
function colocarHoja() {
  const barra = $('barra').offsetHeight;
  const margen = 8;
  const libreW = windowWidth - 2 * margen, libreH = windowHeight - barra - 2 * margen;
  escBase = Math.min(libreW / HOJA_W, libreH / HOJA_H);   // escala con la hoja entera a la vista
  fijarVista(vista.z, vista.cx, vista.cy);
}

/** Zona de pantalla donde se ve la hoja (debajo de la barra) y su centro. */
function zonaVista() {
  const barra = $('barra').offsetHeight;
  return { x: windowWidth / 2, y: barra + (windowHeight - barra) / 2 };
}

/** Fija zoom y centro de la vista (con límites) y recalcula escala y posición del lienzo. */
function fijarVista(z, cx, cy) {
  vista.z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
  vista.cx = Math.min(LIMITE, Math.max(-LIMITE, cx));
  vista.cy = Math.min(LIMITE, Math.max(-LIMITE, cy));
  esc = escBase * vista.z;
  const c = zonaVista();
  ox = c.x - vista.cx * esc;
  oy = c.y - vista.cy * esc;
  actualizarBotones();
}

/** Zoom de factor `f` manteniendo fijo el punto de pantalla (px, py): lo que tocas no se mueve. */
function zoomEn(f, px, py, mover) {
  const wx = (px - ox) / esc, wy = (py - oy) / esc;                  // punto del lienzo bajo (px,py)
  const z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, vista.z * f));
  const e2 = escBase * z, c = zonaVista();
  const qx = px + (mover ? mover.x : 0), qy = py + (mover ? mover.y : 0);  // dónde debe quedar ese punto
  fijarVista(z, wx - (qx - c.x) / e2, wy - (qy - c.y) / e2);
}

/** Repinta todos los trazos terminados en la capa y refresca la pantalla. */
function reconstruir() {
  if (capa) capa.remove();
  capa = createGraphics(width, height);
  capa.pixelDensity(pixelDensity());
  capa.clear();
  trazos.forEach((t) => { if (visible(t)) pintarTrazo(capa, t, 1); });   // solo lo que cae en pantalla
  capaVista = { esc: esc, ox: ox, oy: oy };
  redraw();
}

/** Caja que ocupa un trazo (en unidades del lienzo); se calcula una vez y se guarda. */
function cajaDe(t) {
  if (!t.caja) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    t.puntos.forEach((q) => { x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); });
    Object.defineProperty(t, 'caja', { value: [x0, y0, x1, y1], enumerable: false });   // no se guarda en el JSON
  }
  return t.caja;
}
/** ¿Cae el trazo (al menos en parte) dentro de la pantalla? */
function visible(t) {
  const c = cajaDe(t), m = t.grosor * esc * 2;
  return ox + c[2] * esc + m >= 0 && ox + c[0] * esc - m <= width && oy + c[3] * esc + m >= 0 && oy + c[1] * esc - m <= height;
}

/** Rejilla muy suave: sirve de referencia al moverte y hacer zoom en el lienzo infinito. */
function rejilla() {
  let paso = 500;
  while (paso * esc < 16) paso *= 5;                  // más espaciada cuanto más lejos estás
  while (paso * esc > 160) paso /= 5;
  stroke(238); strokeWeight(1);
  const x0 = Math.floor(-ox / esc / paso) * paso, y0 = Math.floor(-oy / esc / paso) * paso;
  for (let x = x0; ox + x * esc <= width; x += paso) line(ox + x * esc, 0, ox + x * esc, height);
  for (let y = y0; oy + y * esc <= height; y += paso) line(0, oy + y * esc, width, oy + y * esc);
}

function draw() {
  background(255);                                   // lienzo infinito: blanco por todas partes
  rejilla();
  if (fondo && fondoVisible) {                       // imagen de fondo: centrada en la hoja, ajustada sin deformar
    const k = Math.min(HOJA_W / fondo.img.width, HOJA_H / fondo.img.height);
    const w = fondo.img.width * k * esc, h = fondo.img.height * k * esc;
    drawingContext.drawImage(fondo.img, ox + (HOJA_W / 2) * esc - w / 2, oy + (HOJA_H / 2) * esc - h / 2, w, h);
  }
  // Mientras haces zoom o mueves, la capa ya pintada se estira (rápido); al soltar se repinta nítida
  push();
  translate(ox, oy); scale(esc / capaVista.esc); translate(-capaVista.ox, -capaVista.oy);
  image(capa, 0, 0, width, height);
  pop();
  if (actual) pintarTrazo(window, actual, 1);
}

/** Dibuja un trazo en `g` (el lienzo o la capa). Con presión, el grosor varía tramo a tramo. */
function pintarTrazo(g, t, desde) {
  const p = t.puntos;
  g.stroke(t.color || '#000000'); g.noFill(); g.strokeCap(ROUND); g.strokeJoin(ROUND);
  if (p.length === 1) {                              // un toque = un punto
    g.strokeWeight(Math.max(1, t.grosor * esc * factor(p[0][3])));
    g.point(ox + p[0][0] * esc, oy + p[0][1] * esc);
    return;
  }
  for (let i = Math.max(1, desde); i < p.length; i++) {
    g.strokeWeight(Math.max(1, t.grosor * esc * factor((p[i - 1][3] + p[i][3]) / 2)));
    g.line(ox + p[i - 1][0] * esc, oy + p[i - 1][1] * esc, ox + p[i][0] * esc, oy + p[i][1] * esc);
  }
}

/** Presión (0..1) → factor de grosor. Presión 0,5 (dedo, ratón) = grosor normal. */
function factor(pr) { return 0.35 + 1.3 * pr; }

/* ───────── Dibujo con puntero (dedo, Pencil, ratón) ───────── */
/* Reglas:
   - Pencil o ratón: dibuja.  Un dedo: dibuja (salvo que se haya usado el Pencil: entonces es la palma).
   - Dos dedos: mover la hoja (el pellizco no hace zoom). Si había un trazo empezado con el primer dedo, se descarta.
   - Botón ✋ Mover: un dedo o el ratón mueven la hoja y no dibujan. */
function alBajar(e) {
  if (e.pointerType === 'pen') hayLapiz = true;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  mantenerPantallaEncendida();
  try { e.target.setPointerCapture(e.pointerId); } catch (x) { /* nada */ }

  const cuentaParaGesto = e.pointerType !== 'pen' || modoMover;
  if (cuentaParaGesto) punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (cuentaParaGesto && (modoMover || punteros.size >= 2)) {
    descartarTrazoActual();                          // el primer dedo no era para dibujar
    iniciarGesto();
    return;
  }
  if (idPuntero !== null || gesto) return;           // ya hay un puntero dibujando
  if (e.pointerType === 'touch' && hayLapiz) return; // con Pencil, el dedo/palma no dibuja
  idPuntero = e.pointerId;
  $('barra').classList.add('dibujando');
  t0 = performance.now();
  actual = { grosor: grosor, color: color, puntos: [] };
  ultimo = null;
  anadir(e, true);
  redraw();
}

function alMover(e) {
  if (punteros.has(e.pointerId)) {
    e.preventDefault();
    punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (gesto) { hacerGesto(); return; }
  }
  if (e.pointerId !== idPuntero || !actual) return;
  e.preventDefault();
  const lista = e.getCoalescedEvents ? e.getCoalescedEvents() : [];   // todos los puntos intermedios del Pencil
  (lista.length ? lista : [e]).forEach((ev) => anadir(ev, false));
  redraw();
}

function alSubir(e) {
  const eraGesto = !!gesto && punteros.has(e.pointerId);
  punteros.delete(e.pointerId);
  if (eraGesto) {
    e.preventDefault();
    if (punteros.size >= (modoMover ? 1 : 2)) iniciarGesto();   // queda un gesto válido: se reajusta sin saltos
    else { gesto = null; reconstruir(); }                       // fin del gesto: repinta nítido
    return;
  }
  if (e.pointerId !== idPuntero) return;
  e.preventDefault();
  if (actual) {
    anadir(e, false, true);                          // el último punto, sin suavizar: el trazo acaba donde levantas
    guardarHistorial();
    trazos.push(actual);
    pintarTrazo(capa, actual, 1);
    actual = null;
    guardarLocal();
  }
  idPuntero = null; ultimo = null;
  $('barra').classList.remove('dibujando');
  actualizarBotones();
  redraw();
}

function descartarTrazoActual() {
  actual = null; idPuntero = null; ultimo = null;
  $('barra').classList.remove('dibujando');
}

/* ───────── Zoom y desplazamiento ───────── */
/** Centro y separación de los dedos apoyados (con uno solo, la separación es 0). */
function medidas() {
  const p = [...punteros.values()];
  const cx = p.reduce((s, q) => s + q.x, 0) / p.length, cy = p.reduce((s, q) => s + q.y, 0) / p.length;
  const d = p.length >= 2 ? Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) : 0;
  return { cx: cx, cy: cy, d: d };
}
function iniciarGesto() { gesto = medidas(); }
function hacerGesto() {
  const m = medidas();
  // El pellizco NO hace zoom (se usan los botones ＋ －); dos dedos solo desplazan la hoja
  zoomEn(1, gesto.cx, gesto.cy, { x: m.cx - gesto.cx, y: m.cy - gesto.cy });
  gesto = m;
  redraw();
}

/** Zoom con los botones: alrededor del centro de la vista. */
function zoomBoton(f) {
  const c = zonaVista();
  zoomEn(f, c.x, c.y);
  reconstruir();
}
/** «Ver todo»: encuadra todo lo dibujado (o la hoja inicial si aún no hay nada). */
function encajar() {
  if (!trazos.length) { fijarVista(1, HOJA_W / 2, HOJA_H / 2); reconstruir(); return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  trazos.forEach((t) => { const c = cajaDe(t); x0 = Math.min(x0, c[0]); y0 = Math.min(y0, c[1]); x1 = Math.max(x1, c[2]); y1 = Math.max(y1, c[3]); });
  const barra = $('barra').offsetHeight;
  const w = Math.max(x1 - x0, 100), h = Math.max(y1 - y0, 100);
  const e = Math.min((windowWidth - 24) / w, (windowHeight - barra - 24) / h);
  fijarVista(e / escBase, (x0 + x1) / 2, (y0 + y1) / 2);
  reconstruir();
}

/* Ratón / trackpad del Mac: rueda = desplazar (el pellizco del trackpad no hace zoom) */
function alRueda(e) {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) return;                // pellizco del trackpad: ignorado
  zoomEn(1, e.clientX, e.clientY, { x: -e.deltaX, y: -e.deltaY });
  clearTimeout(alRueda.t); alRueda.t = setTimeout(reconstruir, 120);
  redraw();
}

/** Añade un punto al trazo actual (suavizado ligero y distancia mínima). */
function anadir(ev, primero, final) {
  let x = ev.clientX, y = ev.clientY;
  const presion = (ev.pointerType === 'pen' && ev.pressure > 0) ? ev.pressure : 0.5;
  if (!primero && ultimo && !final) {                // media móvil exponencial: quita el temblor
    x = ultimo.x + (x - ultimo.x) * (1 - SUAVIZADO);
    y = ultimo.y + (y - ultimo.y) * (1 - SUAVIZADO);
  }
  if (ultimo && Math.hypot(x - ultimo.x, y - ultimo.y) < DIST_MIN && !final) return;
  if (final && ultimo && Math.hypot(x - ultimo.x, y - ultimo.y) < 0.01) return;
  ultimo = { x: x, y: y };
  const nx = (x - ox) / esc, ny = (y - oy) / esc;                      // coordenadas del lienzo
  actual.puntos.push([r(nx, 1), r(ny, 1), Math.round(performance.now() - t0), r(presion, 2)]);
}
function r(v, d) { const k = Math.pow(10, d); return Math.round(v * k) / k; }

/* ───────── Historial ───────── */
function guardarHistorial() {
  deshacer.push(trazos.slice());                     // los trazos no se modifican: basta copiar la lista
  if (deshacer.length > 200) deshacer.shift();
  rehacer = [];
}
function accionDeshacer() {
  if (!deshacer.length) return;
  rehacer.push(trazos); trazos = deshacer.pop();
  cambio();
}
function accionRehacer() {
  if (!rehacer.length) return;
  deshacer.push(trazos); trazos = rehacer.pop();
  cambio();
}
function accionBorrar() {
  if (!trazos.length) return;
  guardarHistorial(); trazos = [];                   // se puede recuperar con Deshacer
  cambio();
}
function cambio() { guardarLocal(); reconstruir(); actualizarBotones(); }

function actualizarBotones() {
  $('bDeshacer').disabled = !deshacer.length;
  $('bRehacer').disabled = !rehacer.length;
  $('bBorrar').disabled = !trazos.length;
  $('estado').textContent = trazos.length + (trazos.length === 1 ? ' trazo' : ' trazos') + (Math.abs(vista.z - 1) > 0.01 ? ' · ' + Math.round(vista.z * 100) + ' %' : '');
  $('bMover').classList.toggle('activo', modoMover);
  $('bFondo').disabled = !fondo;
  $('bFondo').classList.toggle('activo', !!fondo && fondoVisible);
}

/* ───────── Guardado automático en el navegador ───────── */
function guardarLocal() {
  try { localStorage.setItem(CLAVE, JSON.stringify(aJSON())); } catch (e) { /* lleno o bloqueado: se ignora */ }
}
function cargarLocal() {
  try {
    const txt = localStorage.getItem(CLAVE);
    if (txt) trazos = leerJSON(JSON.parse(txt));
    const g = +localStorage.getItem(CLAVE + '-grosor');
    if (g >= 4 && g <= 80) { grosor = g; $('rGrosor').value = g; }
    const c = localStorage.getItem(CLAVE + '-color');
    if (/^#[0-9a-f]{6}$/i.test(c)) color = c;
    fondoVisible = localStorage.getItem(CLAVE + '-fondo-visible') !== '0';
  } catch (e) { trazos = []; }
}

/* ───────── Exportar / importar ───────── */
function aJSON() {
  return { formato: 'trazos-v2', hoja: { ancho: HOJA_W, alto: HOJA_H },
           trazos: trazos.map((t) => ({ grosor: t.grosor, color: t.color || '#000000', puntos: t.puntos })) };
}

/** Valida un JSON cargado y devuelve la lista de trazos (o lanza un error). */
function leerJSON(o) {
  if (!o || !Array.isArray(o.trazos)) throw new Error('No es un archivo de trazos');
  const v1 = o.formato === 'trazos-v1';              // v1: coordenadas 0..1 sobre la hoja → se pasan a unidades de hoja
  const kx = v1 ? HOJA_W : 1, ky = v1 ? HOJA_H : 1;
  return o.trazos.map((t) => {
    if (!t || !Array.isArray(t.puntos) || !t.puntos.length) throw new Error('Trazo sin puntos');
    const puntos = t.puntos.map((q) => {
      if (!Array.isArray(q) || !isFinite(q[0]) || !isFinite(q[1])) throw new Error('Punto no válido');
      return [+q[0] * kx, +q[1] * ky, isFinite(q[2]) ? +q[2] : 0, isFinite(q[3]) ? +q[3] : 0.5];
    });
    return { grosor: isFinite(t.grosor) ? +t.grosor : 14, color: /^#[0-9a-f]{6}$/i.test(t.color) ? t.color : '#000000', puntos: puntos };
  });
}

/** Cada trazo → un <path> con línea (sin relleno). El viewBox se ajusta a lo dibujado (con un margen). */
function aSVG() {
  const f1 = (v) => (Math.round(v * 10) / 10).toString();
  let x0 = 0, y0 = 0, x1 = HOJA_W, y1 = HOJA_H;      // sin trazos: la hoja inicial
  if (trazos.length) {
    x0 = y0 = Infinity; x1 = y1 = -Infinity;
    trazos.forEach((t) => { const c = cajaDe(t), m = t.grosor * 1.7;
      x0 = Math.min(x0, c[0] - m); y0 = Math.min(y0, c[1] - m); x1 = Math.max(x1, c[2] + m); y1 = Math.max(y1, c[3] + m); });
  }
  const paths = trazos.map((t) => {
    const media = t.puntos.reduce((s, q) => s + q[3], 0) / t.puntos.length;
    const w = f1(t.grosor * factor(media));
    let d = 'M' + f1(t.puntos[0][0]) + ',' + f1(t.puntos[0][1]);
    if (t.puntos.length === 1) d += 'l0.01,0';       // un punto: path de longitud mínima
    for (let i = 1; i < t.puntos.length; i++) d += 'L' + f1(t.puntos[i][0]) + ',' + f1(t.puntos[i][1]);
    return '  <path d="' + d + '" fill="none" stroke="' + (t.color || '#000000') + '" stroke-width="' + w + '"/>';
  });
  return '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + f1(x0) + ' ' + f1(y0) + ' ' + f1(x1 - x0) + ' ' + f1(y1 - y0) + '" width="100%" height="100%" ' +
    'style="fill:none;stroke:#000;stroke-linecap:round;stroke-linejoin:round">\n' + paths.join('\n') + '\n</svg>\n';
}

function nombreArchivo(ext) {
  const d = new Date(), z = (n) => String(n).padStart(2, '0');
  return 'trazos-' + d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '-' + z(d.getHours()) + z(d.getMinutes()) + '.' + ext;
}

function descargar(texto, tipo, nombre) {
  const url = URL.createObjectURL(new Blob([texto], { type: tipo }));
  const a = document.createElement('a');
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function compartir() {
  if (!trazos.length) return aviso('No hay trazos que compartir');
  const archivos = [
    new File([aSVG()], nombreArchivo('svg'), { type: 'image/svg+xml' }),
    new File([JSON.stringify(aJSON())], nombreArchivo('json'), { type: 'application/json' }),
  ];
  if (navigator.canShare && navigator.canShare({ files: archivos })) {
    try { await navigator.share({ files: archivos, title: 'Trazos' }); }
    catch (e) { /* cancelado */ }
  } else {
    aviso('Este navegador no puede compartir: usa SVG o JSON');
  }
}

function abrir(archivo) {
  if (!archivo) return;
  archivo.text().then((txt) => {
    const nuevos = leerJSON(JSON.parse(txt));
    guardarHistorial(); trazos = nuevos;
    cambio(); aviso('Cargados ' + nuevos.length + ' trazos');
  }).catch((e) => aviso('No se pudo abrir: ' + e.message));
  $('fArchivo').value = '';
}

/* ───────── Color de los trazos ───────── */
function elegirColor(c) {
  color = c.toLowerCase();
  try { localStorage.setItem(CLAVE + '-color', color); } catch (x) { /* nada */ }
  actualizarColores();
}
function actualizarColores() {
  document.querySelectorAll('#colores .color').forEach((b) => b.classList.toggle('activo', b.dataset.c === color));
  $('cColor').value = color;
}

/* ───────── Imagen de fondo ───────── */
/** Carga una imagen desde una URL (dataURL u objectURL) y la deja como fondo. */
function ponerFondo(url) {
  return new Promise((ok, mal) => {
    const img = new Image();
    img.onload = () => { fondo = { img: img }; actualizarBotones(); redraw(); ok(); };
    img.onerror = () => mal(new Error('imagen no válida'));
    img.src = url;
  });
}
/** Reduce la imagen (máx. 2400 px) y la guarda en el navegador para que siga ahí al reabrir. */
function cargarImagenFondo(archivo) {
  if (!archivo) return;
  const url = URL.createObjectURL(archivo);
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 2400 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const dataUrl = c.toDataURL('image/jpeg', 0.85);
    fondoVisible = true;
    try { localStorage.setItem(CLAVE_FONDO, dataUrl); localStorage.setItem(CLAVE + '-fondo-visible', '1'); }
    catch (x) { aviso('Imagen puesta, pero no cabe para guardarla al cerrar'); }
    ponerFondo(dataUrl);
  };
  img.onerror = () => { URL.revokeObjectURL(url); aviso('No se pudo abrir la imagen'); };
  img.src = url;
  $('fImagen').value = '';
}
function alternarFondo() {
  if (!fondo) return;
  fondoVisible = !fondoVisible;
  try { localStorage.setItem(CLAVE + '-fondo-visible', fondoVisible ? '1' : '0'); } catch (x) { /* nada */ }
  actualizarBotones(); redraw();
  aviso(fondoVisible ? 'Fondo activado' : 'Fondo desactivado');
}

/* ───────── Pantalla encendida y pantalla completa ───────── */
let wakeLock = null, noSleep = null, pantallaActiva = false;
function mantenerPantallaEncendida() {
  if (pantallaActiva) return;
  pantallaActiva = true;
  // Wake Lock solo existe en HTTPS; desde http://192.168… se usa NoSleep.js (si el servidor lo ofrece)
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').then((w) => { wakeLock = w; }).catch(() => cargarNoSleep());
  } else {
    cargarNoSleep();
  }
}
function cargarNoSleep() {
  const s = document.createElement('script');
  s.src = 'NoSleep.min.js';
  s.onload = () => { try { noSleep = new NoSleep(); noSleep.enable(); } catch (e) { /* nada */ } };
  s.onerror = () => { /* sin servidor: Ajustes > Pantalla y brillo > Bloqueo automático > Nunca */ };
  document.head.appendChild(s);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && pantallaActiva && 'wakeLock' in navigator && (!wakeLock || wakeLock.released)) {
    navigator.wakeLock.request('screen').then((w) => { wakeLock = w; }).catch(() => {});
  }
});

/* ───────── Botones ───────── */
let temporizadorAviso = null;
function aviso(texto) {
  const a = $('aviso'); a.textContent = texto; a.classList.add('visible');
  clearTimeout(temporizadorAviso);
  temporizadorAviso = setTimeout(() => a.classList.remove('visible'), 2200);
}

$('bDeshacer').onclick = accionDeshacer;
$('bRehacer').onclick = accionRehacer;
$('bBorrar').onclick = accionBorrar;
$('bZoomMas').onclick = () => zoomBoton(1.6);
$('bZoomMenos').onclick = () => zoomBoton(1 / 1.6);
$('bEncajar').onclick = encajar;
$('bMover').onclick = () => { modoMover = !modoMover; actualizarBotones(); aviso(modoMover ? 'Mover: arrastra la hoja con un dedo' : 'Dibujar'); };
$('fImagen').onchange = (e) => cargarImagenFondo(e.target.files[0]);
$('bFondo').onclick = alternarFondo;
document.querySelectorAll('#colores .color').forEach((b) => { b.onclick = () => elegirColor(b.dataset.c); });
$('cColor').oninput = (e) => elegirColor(e.target.value);
$('bSVG').onclick = () => trazos.length ? descargar(aSVG(), 'image/svg+xml', nombreArchivo('svg')) : aviso('No hay trazos');
$('bJSON').onclick = () => trazos.length ? descargar(JSON.stringify(aJSON()), 'application/json', nombreArchivo('json')) : aviso('No hay trazos');
$('bCompartir').onclick = compartir;
$('fArchivo').onchange = (e) => abrir(e.target.files[0]);
$('rGrosor').oninput = (e) => {
  grosor = +e.target.value;
  try { localStorage.setItem(CLAVE + '-grosor', grosor); } catch (x) { /* nada */ }
};
if (document.documentElement.requestFullscreen) {    // en iPhone no existe: allí vale "Añadir a pantalla de inicio"
  $('bPantalla').hidden = false;
  $('bPantalla').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
}
document.addEventListener('keydown', (e) => {         // atajos con teclado (ratón en el Mac)
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? accionRehacer() : accionDeshacer(); }
});

/* ───────── Funcionar sin Internet ─────────
   El service worker (sw.js) guarda la página y p5 en el iPad la primera vez que se abre con conexión.
   Después, "Añadir a pantalla de inicio" y se abre sin red. Solo funciona con HTTPS (o localhost). */
if ('serviceWorker' in navigator) {
  const habiaSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => { /* sin HTTPS: se usa como página normal */ });
  // Si una versión nueva toma el control, recarga para enseñarla enseguida
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (habiaSW && !actual) location.reload(); });
}
</script>
</body>
